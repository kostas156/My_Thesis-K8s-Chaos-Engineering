kind: StressChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  namespace: online-boutique
  name: full-stress-medium-20m
spec:
  selector:
    namespaces:
      - online-boutique
  mode: all
  stressors:
    memory:
      workers: 1
      size: 96MiB
    cpu:
      workers: 2
      load: 80
  duration: 20m